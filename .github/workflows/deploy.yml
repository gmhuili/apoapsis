name: Build and deploy apoapsis site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.152.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugo (extended)
        run: |
          wget -qO hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb

      - uses: actions/checkout@v4
        with:
          submodules: recursive   # pulls the theme
          fetch-depth: 0          # enableGitInfo needs full history

      - name: Fail early if the theme submodule is empty
        run: |
          if [ ! -f site/themes/PaperMod/layouts/baseof.html ]; then
            echo "::error::PaperMod is missing — the submodule did not check out."
            echo "Locally run: git submodule update --init --recursive"
            exit 1
          fi

      - uses: actions/configure-pages@v5
        id: pages
        with:
          # Turn Pages on if it has never been enabled. Without this, the very
          # first run dies here with a bare 404:
          #   "Get Pages site failed ... Error: Not Found"
          enablement: true

      - name: Build site
        working-directory: ./site
        env:
          HUGO_ENVIRONMENT: production
        run: |
          hugo --minify --gc \
               --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Build search index
        working-directory: ./site
        run: |
          npx -y pagefind@latest \
            --site public \
            --root-selector "article.post-single, main.main" \
            --output-subdir pagefind

      - name: Report what was built
        working-directory: ./site
        run: |
          echo "HTML pages: $(find public -name '*.html' | wc -l)"
          echo "Total size: $(du -sh public | cut -f1)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
