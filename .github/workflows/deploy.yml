name: Build and deploy apoapsis site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.152.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugo (extended)
        run: |
          wget -qO hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb

      - uses: actions/checkout@v4
        with:
          submodules: recursive   # pulls the theme
          fetch-depth: 0          # enableGitInfo needs full history

      - uses: actions/configure-pages@v5
        id: pages

      - name: Build site
        working-directory: ./site
        env:
          HUGO_ENVIRONMENT: production
        run: |
          hugo --minify --gc \
               --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Build search index
        working-directory: ./site
        run: |
          npx -y pagefind@latest \
            --site public \
            --root-selector "article.post-single, main.main" \
            --output-subdir pagefind

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
